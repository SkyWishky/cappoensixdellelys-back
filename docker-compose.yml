services:
  database:
    image: ghcr.io/skywishky/cappoensixdellelys-database:latest
    container_name: tamagotchi-db-backdev
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tamagochi}
      POSTGRES_USER: ${POSTGRES_USER:-tamagochi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata_backdev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tamagochi} -d ${POSTGRES_DB:-tamagochi}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - tamagotchi_net

  back:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/skywishky/cappoensixdellelys-back:local
    container_name: tamagotchi-back-local
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-tamagochi}
      DB_USER: ${POSTGRES_USER:-tamagochi}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      SERVER_PORT: 8080
      PET_DECAY_INTERVAL: 10000
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - tamagotchi_net

  front:
    image: ghcr.io/skywishky/cappoensixdellelys-front:latest
    container_name: tamagotchi-front-backdev
    restart: unless-stopped
    depends_on:
      back:
        condition: service_healthy
    environment:
      PORT: 8080
      BACKEND_URL: http://back:8080
    ports:
      - "127.0.0.1:4200:8080"
    networks:
      - tamagotchi_net

volumes:
  pgdata_backdev:

networks:
  tamagotchi_net:
    driver: bridge
